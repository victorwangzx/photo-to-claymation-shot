name: Bug or improvement
description: Report a problem or suggest an improvement.
title: "[Feedback] "
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        Please do not upload private portraits, children's photos, client images, or images you do not have permission to publish.
  - type: dropdown
    id: issue_type
    attributes:
      label: Type
      options:
        - Bug
        - Character likeness issue
        - Claymation style issue
        - Comparison layout issue
        - Documentation improvement
        - Feature request
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should the skill have done?
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Non-sensitive context
      description: Safe reproduction details, style goal, and output type.
    validations:
      required: false
